name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deuxly
          POSTGRES_PASSWORD: deuxly
          POSTGRES_DB: deuxly
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U deuxly -d deuxly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://deuxly:deuxly@localhost:55432/deuxly?schema=public
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3100
      APP_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
